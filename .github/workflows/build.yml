name: Build KeybagCacheSkip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        variant: [rootless, roothide]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rootless 用官方 theos；roothide 必须用 roothide 官方 fork 的 theos
      # （github.com/roothide/theos），普通 theos 不认 roothide scheme
      - name: Setup Theos (Rootless)
        if: matrix.variant == 'rootless'
        run: |
          git clone --recurse-submodules https://github.com/theos/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV

      - name: Setup Theos (Roothide)
        if: matrix.variant == 'roothide'
        run: |
          git clone --recurse-submodules https://github.com/roothide/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=roothide" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          # 新版 Homebrew 默认要求 tap trust，未信任时 brew install 直接中断。
          # CI runner 上装的是第三方 tap，这里显式关掉该检查。
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg ldid

      - name: Install SDK
        run: |
          cd ${{ runner.temp }}/theos/sdks
          curl -sLO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS16.5.sdk .
          rm -rf sdks-master master.zip

      - name: Build
        run: make package

      # 生死断言（2026-09-28 实机证明）：keybagd 里 libellekit/libsubstrate 加载不出来，
      # 所以只要 dylib 的 LC_LOAD_DYLIB 里还有 substrate/ellekit，dlopen 就会静默失败，
      # 插件完全不加载、一行日志都没有。构建产物一旦带上它，直接 fail，别浪费一次实机测试。
      - name: Verify dylib has no substrate/ellekit dependency
        run: |
          DYLIB=$(find .theos -name 'KeybagCacheSkip.dylib' -type f | head -1)
          echo "== $DYLIB =="
          otool -L "$DYLIB"
          if otool -L "$DYLIB" | grep -qiE 'substrate|ellekit'; then
            echo "::error::KeybagCacheSkip.dylib still links substrate/ellekit -> dlopen() will fail in keybagd"
            exit 1
          fi
          echo "OK: substrate-free"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: KeybagCacheSkip-${{ matrix.variant }}
          path: packages/*.deb
